<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>watch_onCleanUp implement</title>
</head>
<body>
    <div id="app">
      <div id="app_watch"></div>
    </div>
</body>
<script type="module">
    import {ref, watch} from './reactivity.js';
    
    // varablies
    let timer = 3000
    const val = ref("");

    // function
    function getData(timer){
        return new Promise((resolve,reject)=>{
            setTimeout(()=>{
                resolve(timer)
            },timer)
        })
    }

    // watch
    watch(val,async (newValue,oldValue,onCleanUp)=>{
        console.log(newValue,oldValue);
        let flag = true
        timer -= 1000

        onCleanUp(()=>{
            flag = false
        }) 

        let result = await getData(timer)

        if(flag){
            app_watch.innerHTML = `new value: ${val.value}, result: ${result}`
        }
    })

    setTimeout(()=>{
        val.value = "vue2 lesson"
        val.value = "vue3 lesson"
    },1000)
</script>
</html>
