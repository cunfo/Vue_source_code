<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>computed implement</title>
</head>
<body>
    <div id="app">
        <div id="app_reative"></div>
        <div id="app_ref"></div>
    </div>
</body>
<script type="module">
    /* 
    * computed 计算属性
    * computed 执行后的结果是一个ref 不可改变
    * computed 有缓存机制,多次访问只会执行一次，通过dirty脏机制来控制是否执行
    * computed 也是一个effect
    */
    import {reactive, ref, effect, computed} from './reactivity.js'

    // varables
    const state = reactive({name:"vue3"})
    const count = ref(0)

    // computed
    // 对象
    // const aliasName = computed({
    //     get(oldValue){
    //         return "learning " + state.name;
    //     },
    //     set(v){}
    // })

    // 函数
    const aliasName = computed(()=>{
        return "learning " + state.name;
    })

    const aliasCount = computed(()=>{
        return count.value + 10;
    })


    // effect
    effect(()=>{
        app_reative.innerHTML = `reactive计算属性: ${aliasName.value}`
        app_ref.innerHTML = `ref计算属性: ${aliasCount.value}`
    })

    effect(()=>{
        console.log(aliasName.value);
        console.log(aliasCount.value);
    })


    setTimeout(()=>{
        state.name = "vue2"
        count.value += 1
    },1000)
</script>
</html>
