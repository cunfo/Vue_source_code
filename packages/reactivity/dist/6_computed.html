<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>computed implement</title>
</head>
<body>
    <div id="app">

    </div>
</body>
<script type="module">
    /* 
    * computed 计算属性
    * computed 执行后的结果是一个ref 不可改变
    * computed 有缓存机制,多次访问只会执行一次，通过dirty脏机制来控制是否执行
    * computed 
    * computed 
    */
    import {reactive, effect, computed} from './reactivity.js'

    // varables
    const state = reactive({name:"vue3"})

    // computed
    // 对象
    // const aliasName = computed({
    //     get(oldValue){
    //         return "learning " + state.name;
    //     },
    //     set(v){}
    // })

    // 函数
    const aliasName = computed(()=>{
        return "learning " + state.name;
    })

    effect
    effect(()=>{
        console.log(aliasName.value);
        console.log(aliasName.value);
        console.log(aliasName.value);
    })

    setTimeout(()=>{
        state.name = "vue2"
        state.name = 'vvvvv'
    },1000)
</script>
</html>
