<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ref implement</title>
  </head>
  <body>
    <div id="app">
      <div id="runner1"></div>
      <div id="runner2"></div>
      <div id="runner3"></div>
      <hr />
      <div id="runner11"></div>
      <div id="runner22"></div>
      <div id="runner33"></div>
    </div>
  </body>
  <script type="module">
    /*
     * ref implement
     * 通过ref()这个方法传递一个参数，这个参数会用类或者对象进行包裹，
     * 然后通过get value()或者set value()，在取值或者修改值的时候进行依赖搜集或依赖触发。
     */
    import { ref, effect } from "./reactivity.js";
    // varable
    // 通过类实现
    const count = ref(0);
    // 通过对象实现
    const count1 = ref(1);

    // effect
    const runner = effect(() => {
      runner1.innerHTML = `count: ${count.value} --- obj: ${count1.value}`;

      effect(() => {
        runner2.innerHTML = `count: ${count.value} --- obj: ${count1.value}`;
      });
    });

    effect(() => {
      runner11.innerHTML = `count: ${count.value} --- obj: ${count1.value}`;

      effect(() => {
        runner22.innerHTML = `count: ${count.value} --- obj: ${count1.value}`;
      });
    });

    setTimeout(() => {
      // console.log("操作1");
      count.value += 1;
      // console.log("操作2");
      // count1.value += 1;
      // console.log("操作3");
      count.value += 1;
    }, 1000);
  </script>
</html>
