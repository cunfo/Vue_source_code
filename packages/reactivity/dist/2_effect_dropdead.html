<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>effect drop_dead problem</title>
</head>
<body>
    <div id="app"></div>
</body>

<script type="module">
/* 
* drop_dead problem
* 由于在类中没有添加约束running属性，
* 导致只要在effect中修改属性就会触发effect中的scheduler
* 致使页面不断更新，导致死循环，导致程序崩溃Uncaught RangeError: Maximum call stack size exceeded
* 解决方法：在类中添加约束running属性，确保只有在running为true时才会触发effect中的scheduler
*/
    import { reactive, effect } from "./reactivity.js";
    // varables
    const state = reactive({
        name:"cunfox",
        age:18
    })
    // const app = document.getElementById('app')

    // effect
    effect(()=>{
        app.innerHTML = `name: ${state.name}, age: ${state.age}`
        // 触发set修改，不触发effect中的scheduler重新执行
        state.age = Math.random()
        console.log(state.age);
    })

    setTimeout(()=>{
        state.age++
    },1000)
</script>
</html>
